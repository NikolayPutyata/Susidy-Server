services:
  api:
    build: .
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/susidy
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      TZ: Europe/Kyiv
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
